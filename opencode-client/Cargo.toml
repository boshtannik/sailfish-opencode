[package]
name = "opencode-client"
version = "0.1.0"
edition = "2021"
description = "Native opencode client for Sailfish OS (Rust + QML)"

[[bin]]
name = "harbour-opencode"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"

voice-engine = { path = "../voice-engine" }
opencode-proto = { path = "../opencode-proto" }

qmetaobject = { path = "vendor/qmetaobject-sfos-rs/qmetaobject" }
sailors = { path = "vendor/sailors" }

cpal = { version = "0.15", optional = true }
hound = { version = "3", optional = true }

[features]
default = []
voice = ["dep:cpal", "dep:hound"]

# Примеры со звуком требуют голосовой стек (модуль `audio` собирается только
# под фичей `voice`) — без этого `cargo check --all-targets` падает на них.
[[example]]
name = "audio_record_play"
required-features = ["voice"]

[[example]]
name = "voice_roundtrip"
required-features = ["voice"]

[profile.release]
opt-level = "s"
